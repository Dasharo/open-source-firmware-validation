# Sensor measurement config.
#
# The library is dumb: for each measurement it runs three bash stages and pipes
# the outputs in bash:
#   gather  - raw, debuggable output (e.g. full `sensors` block)
#   filter  - isolate the value from the raw output (stdin = gather's stdout)
#   process - scaling, rounding etc.
#
# Rules:
#   - Each stage is a bash command run on the DUT.
#   - An empty stage is a passthrough (stdin -> stdout unchanged).
#   - An empty or absent measurement block means that measurement is unsupported
#
# example_measurement:
#   gather: sensors some-sensor-name 2>/dev/null
#   filter: awk -F '[+°]' '/Package id 0:/ {print $2}'
#   process: cut -d. -f1
#
# hwmon example (millidegrees -> degrees):
#   gather: cat /sys/class/hwmon/hwmon0/temp1_input
#   filter  # empty, value is already isolated in the output
#   process: awk '{print int($1/1000)}'

# Run once per device. e.g. install lm-sensors.
# Separate instructions for different ENV_IDs
sensors_requirements_commands:
  "201": [ which sensors || (apt update && apt -y install lm-sensors) ]
  "202": [ which sensors || dnf -y install lm_sensors ]

# Run after each boot, before measuring. e.g. load modules, detect sensors.
sensors_prepare_commands:
  - sensors-detect --auto

cpu_temperature_measurement:
  gather: sensors 2>/dev/null
  filter: awk -F '[+°]' '/Package id 0:/ {print $2}'
  process: cut -d. -f1

