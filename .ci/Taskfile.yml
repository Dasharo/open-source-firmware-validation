version: '3'

includes:
  docker:
    taskfile: https://raw.githubusercontent.com/3mdeb/taskfiles/main/docker.yml

vars:
  IMAGE: ghcr.io/dasharo/osfv-ci:latest
  QEMU_IMAGE: ghcr.io/dasharo/osfv-qemu-ci:latest
  REGRESSION_IMAGE: ghcr.io/dasharo/osfv-qemu-ci:latest
  REPO_ROOT:
    sh: git rev-parse --show-toplevel

tasks:
  ci:pre-commit:
    desc: Run pre-commit (in-container when already in CI, otherwise wrapped)
    dir: '{{.REPO_ROOT}}'
    cmds:
      - |
        if [ -n "${CI:-}" ]; then
          task --taskfile .ci/Taskfile.yml pre-commit:run
        else
          task --taskfile .ci/Taskfile.yml pre-commit:docker
        fi

  pre-commit:run:
    desc: Run pre-commit in the current environment, no container
    dir: '{{.REPO_ROOT}}'
    cmds:
      - sh .ci/pre-commit.sh

  pre-commit:docker:
    desc: Run pre-commit inside {{.IMAGE}}
    dir: '{{.REPO_ROOT}}'
    cmds:
      - task: docker:run
        vars:
          IMAGE: '{{.IMAGE}}'
          VOLUMES: '{{.REPO_ROOT}}:/workspace'
          WORKDIR: /workspace
          COMMAND: sh .ci/pre-commit.sh

  ci:qemu-self-test:
    desc: Run keywords self-tests with QEMU
    dir: '{{.REPO_ROOT}}'
    cmds:
      - |
        if [ -n "${CI:-}" ]; then
          task --taskfile .ci/Taskfile.yml qemu-self-test:run
        else
          task --taskfile .ci/Taskfile.yml qemu-self-test:docker
        fi

  qemu-self-test:run:
    desc: Run the QEMU self-tests in the current environment, no container
    dir: '{{.REPO_ROOT}}'
    cmds:
      - bash .ci/qemu-self-test.sh

  qemu-self-test:docker:
    desc: Run the QEMU self-tests inside {{.QEMU_IMAGE}}
    dir: '{{.REPO_ROOT}}'
    cmds:
      - |
        docker run --rm \
        --device /dev/kvm \
        -v {{.REPO_ROOT}}:/workspace \
        -v /workspace/.venv \
        -w /workspace \
        {{.QEMU_IMAGE}} bash .ci/qemu-self-test.sh

  ci:develop-pr-regression:
    desc: Run the scoped PR regression on $DEVICE (in-container when already in CI, otherwise wrapped)
    dir: '{{.REPO_ROOT}}'
    cmds:
      - task: 'develop-pr-regression:{{if .CI}}run{{else}}docker{{end}}'
        vars:
          DEVICE: '{{.DEVICE}}'

  develop-pr-regression:run:
    desc: Run the PR regression on $DEVICE in the current environment, no container
    dir: '{{.REPO_ROOT}}'
    cmds:
      - DEVICE='{{.DEVICE}}' bash .ci/develop-pr-regression.sh

  develop-pr-regression:docker:
    desc: Run the PR regression on $DEVICE inside {{.REGRESSION_IMAGE}}
    dir: '{{.REPO_ROOT}}'
    cmds:
      # passing ssh agent because develop-pr-regression pulls the remote
      - |
        docker run --rm --network host \
        -e DEVICE='{{.DEVICE}}' -e BASE_BRANCH \
        -e SSH_AUTH_SOCK=/ssh-agent \
        -v "${SSH_AUTH_SOCK}":/ssh-agent \
        -v "${HOME}/.ssh/known_hosts":/root/.ssh/known_hosts:ro \
        -v {{.REPO_ROOT}}:/workspace \
        -v /workspace/.venv \
        -v "${HOME}/.osfv":/root/.osfv:ro \
        -w /workspace \
        {{.REGRESSION_IMAGE}} bash .ci/develop-pr-regression.sh

  ci:image:build:
    desc: Build the CI image, tagged with a UTC timestamp and latest
    dir: '{{.REPO_ROOT}}'
    cmds:
      - |
        docker build -f .ci/Dockerfile \
          -t {{.IMAGE_NAME}}:{{.BUILD_TAG}} \
          -t {{.IMAGE_NAME}}:latest \
          .
      - echo "Built {{.IMAGE_NAME}}:{{.BUILD_TAG}}"

  ci:image:release:
    desc: Build and push the CI image
    dir: '{{.REPO_ROOT}}'
    vars:
      TAG:
        sh: echo "$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
    cmds:
      - task: ci:image:build
        vars: {BUILD_TAG: '{{.TAG}}'}
      - task: ci:image:push
        vars: {BUILD_TAG: '{{.TAG}}'}

  ci:image:push:
    desc: Push both tags of the CI image
    cmds:
      - docker push {{.IMAGE_NAME}}:{{.BUILD_TAG}}
      - docker push {{.IMAGE_NAME}}:latest


  ci:image:qemu:build:
    desc: Build the QEMU CI image, tagged with a UTC timestamp and latest
    dir: '{{.REPO_ROOT}}'
    cmds:
      - |
        docker build -f .ci/Dockerfile.qemu \
          -t {{.QEMU_IMAGE_NAME}}:{{.BUILD_TAG}} \
          -t {{.QEMU_IMAGE_NAME}}:latest \
          .
      - echo "Built {{.QEMU_IMAGE_NAME}}:{{.BUILD_TAG}}"

  ci:image:qemu:release:
    desc: Build and push the QEMU CI image
    dir: '{{.REPO_ROOT}}'
    vars:
      TAG:
        sh: echo "$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
    cmds:
      - task: ci:image:qemu:build
        vars: {BUILD_TAG: '{{.TAG}}'}
      - task: ci:image:qemu:push
        vars: {BUILD_TAG: '{{.TAG}}'}

  ci:image:qemu:push:
    desc: Push both tags of the QEMU CI image
    cmds:
      - docker push {{.QEMU_IMAGE_NAME}}:{{.BUILD_TAG}}
      - docker push {{.QEMU_IMAGE_NAME}}:latest
