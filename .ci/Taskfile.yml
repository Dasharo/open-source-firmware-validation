version: '3'

includes:
  pre-commit: tasks/pre-commit.yml
  qemu-self-test: tasks/qemu-self-test.yml
  develop-pr-regression: tasks/develop-pr-regression.yml
  image: tasks/image.yml
  stability: tasks/stability.yml

tasks:
  ci:pre-commit:
    desc: Run pre-commit
    cmds:
      - task: pre-commit:main

  ci:qemu-self-test:
    desc: Run keywords self-tests with QEMU
    cmds:
      - task: qemu-self-test:main
  ci:qemu-stress-test:
    desc: Run keyword stress-tests with QEMU
    cmds:
      - task: qemu-self-test:stress:main

  ci:develop-pr-regression:
    desc: Run the scoped PR regression on $DEVICE (in-container when already in CI, otherwise wrapped)
    cmds:
      - task: develop-pr-regression:main

  ci:stability:
    desc: Run the release test scope REPEATS times on every device of DEVICES
    cmds:
      - task: stability:main

  ci:stability-device:
    desc: Run the release test scope REPEATS times on $DEVICE
    cmds:
      - task: stability:device

  ci:image:precommit:build:
    desc: Build the CI image, tagged with a UTC timestamp and latest
    cmds:
      - task: image:precommit:build

  ci:image:precommit:release:
    desc: Build and push the CI image
    cmds:
      - task: image:precommit:release

  ci:image:qemu:build:
    desc: Build the QEMU CI image, tagged with a UTC timestamp and latest
    cmds:
      - task: image:qemu:build

  ci:image:qemu:release:
    desc: Build and push the QEMU CI image
    cmds:
      - task: image:qemu:release
