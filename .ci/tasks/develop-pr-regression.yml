version: '3'

includes:
  docker:
    taskfile: ../../taskfile-templates/templates/common/docker-run.yml
    optional: true

vars:
  REPO_ROOT:
    sh: git rev-parse --show-toplevel
  REGRESSION_IMAGE_NAME: ghcr.io/dasharo/osfv-qemu-ci
  REGRESSION_IMAGE: '{{.REGRESSION_IMAGE_NAME}}:latest'

tasks:
  main:
    desc: Run the scoped PR regression on $DEVICE (in-container when already in CI, otherwise wrapped)
    dir: '{{.REPO_ROOT}}'
    cmds:
      - task: '{{if .CI}}run:local{{else}}run:container{{end}}'
        vars:
          DEVICE: '{{.DEVICE}}'

  run:local:
    desc: Run the PR regression on $DEVICE in the current environment, no container
    dir: '{{.REPO_ROOT}}'
    cmds:
      - DEVICE='{{.DEVICE}}' bash .ci/develop-pr-regression.sh

  run:container:
    desc: Run the PR regression on $DEVICE inside {{.REGRESSION_IMAGE}}
    dir: '{{.REPO_ROOT}}'
    cmds:
      # passing ssh agent because develop-pr-regression pulls the remote
      - task: docker:run
        vars:
          IMAGE: '{{.REGRESSION_IMAGE}}'
          DOCKER_ARGS: --network host
          ENV: 'DEVICE={{.DEVICE}},BASE_BRANCH,SSH_AUTH_SOCK=/ssh-agent'
          VOLUMES: '$SSH_AUTH_SOCK:/ssh-agent,$HOME/.ssh/known_hosts:/root/.ssh/known_hosts:ro,{{.REPO_ROOT}}:/workspace,$HOME/.osfv:/root/.osfv:ro'
          WORKDIR: /workspace
          COMMAND: bash .ci/develop-pr-regression.sh
