version: '3'

includes:
  docker:
    taskfile: common/docker-run.yml
  test-data:
    taskfile: common/test-data.yml
    dir: ../..

vars:
  REPO_ROOT:
    sh: git rev-parse --show-toplevel
  REGRESSION_IMAGE_NAME: git.3mdeb.com/dasharo/osfv-qemu-ci
  REGRESSION_IMAGE: '{{.REGRESSION_IMAGE_NAME}}:latest'
  REPEATS: '{{.REPEATS | default 2}}'
  DEVICES: scripts/ci/regression-scope/configs/release_tests_devices.txt
  DEVICE_NAMES:
    sh: "cd {{.REPO_ROOT}} && grep -v '^#' {{.DEVICES}}"
  MANUAL_TESTS_LIST: '{{.MANUAL_TESTS_LIST | default "scripts/ci/regression-scope/configs/release_tests_suite_list_minimal.txt"}}'
  RULES_FILE: '{{.RULES_FILE | default "scripts/ci/regression-scope/configs/release_tests_rules.json"}}'
  LOGS_DIR: '{{.LOGS_DIR | default "/srv/nfs/logs/osfv_stability/ci_logs"}}'
  # Identifies one stability run, shared by all its devices. CI overrides it so
  # that the matrix jobs, which each compute their own, land in one directory.
  RUN_ID:
    sh: echo "$(git rev-parse --abbrev-ref HEAD)_$(git rev-parse HEAD)/$(date '+%Y_%m_%d_%H_%M_%S')"

tasks:
  main:
    desc: Run the release test scope REPEATS times on every device of DEVICES
    dir: '{{.REPO_ROOT}}'
    deps:
      - for: {var: DEVICE_NAMES}
        task: device
        vars:
          DEVICE: '{{.ITEM}}'

  device:
    desc: Run the release test scope REPEATS times on DEVICE
    dir: '{{.REPO_ROOT}}'
    vars:
      RUNS:
        sh: seq 0 $(( {{.REPEATS}} - 1 ))
    cmds:
      - for: {var: RUNS}
        task: device:repeat
        vars:
          DEVICE: '{{.DEVICE}}'
          RUN_LOGS_DIR: '{{.LOGS_DIR}}/{{.RUN_ID}}/run{{.ITEM}}'

  device:repeat:
    desc: One repeat of the release test scope on DEVICE
    dir: '{{.REPO_ROOT}}'
    cmds:
      - mkdir -p '{{.RUN_LOGS_DIR}}'
      - task: '{{if .CI}}device:local{{else}}device:container{{end}}'
        vars:
          DEVICE: '{{.DEVICE}}'
          RUN_LOGS_DIR: '{{.RUN_LOGS_DIR}}'

  device:local:
    desc: Run the release test scope on DEVICE in the current environment, no container
    dir: '{{.REPO_ROOT}}'
    vars:
      DEVICE_NAME: '{{base .DEVICE | trimSuffix ".json"}}'
    env:
      DEVICE: '{{.DEVICE}}'
      LOGS_DIR: '{{.RUN_LOGS_DIR}}'
      MANUAL_TESTS_LIST: '{{.MANUAL_TESTS_LIST}}'
      RULES_FILE: '{{.RULES_FILE}}'
      ALLOW_DIRTY: '1'
    cmds:
      - task: test-data:init
      - |
        {{if .QEMU}}bash .ci/qemu-self-test.sh{{end}} \
        scripts/ci/develop_pr_auto_regression.py |& tee '{{.RUN_LOGS_DIR}}/{{.DEVICE_NAME}}.log'

  device:container:
    desc: Run the release test scope on DEVICE inside {{.REGRESSION_IMAGE}}
    dir: '{{.REPO_ROOT}}'
    vars:
      DEVICE_NAME: '{{base .DEVICE | trimSuffix ".json"}}'
      DEVICE_ABS:
        sh: readlink -f "{{.DEVICE}}"
    cmds:
      - task: test-data:init
      # network host for the lab devices (RTE, PiKVM, Sonoff), ~/.osfv for the
      # Snipe-IT credentials, the NFS share for the logs
      - task: docker:run
        vars:
          IMAGE: '{{.REGRESSION_IMAGE}}'
          DOCKER_ARGS: '--network host {{if .QEMU}}--device /dev/kvm{{end}}'
          ENV: 'DEVICE={{.DEVICE_ABS}},LOGS_DIR={{.RUN_LOGS_DIR}},MANUAL_TESTS_LIST={{.MANUAL_TESTS_LIST}},RULES_FILE={{.RULES_FILE}},ALLOW_DIRTY=1,OSFV_ROMS_DIR={{.OSFV_ROMS_DIR}}'
          VOLUMES: '{{.REPO_ROOT}}:/workspace,/srv/nfs/logs:/srv/nfs/logs,$HOME/.osfv:/root/.osfv:ro,{{.DEVICE_ABS}}:{{.DEVICE_ABS}}:ro,{{.OSFV_ROMS_DIR}}:{{.OSFV_ROMS_DIR}}:ro'
          WORKDIR: /workspace
          COMMAND: '{{if .QEMU}}bash .ci/qemu-self-test.sh{{end}} scripts/ci/develop_pr_auto_regression.py 2>&1 | tee "{{.RUN_LOGS_DIR}}/{{.DEVICE_NAME}}.log"'
