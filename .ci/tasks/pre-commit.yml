version: '3'

includes:
  docker:
    taskfile: ../../taskfile-templates/templates/common/docker-run.yml
    optional: true
  lint:
    taskfile: ../../taskfile-templates/templates/lint/pre-commit.yml
    optional: true
    dir: ../..

vars:
  REPO_ROOT:
    sh: git rev-parse --show-toplevel
  PRECOMMIT_IMAGE_NAME: ghcr.io/dasharo/osfv-ci
  PRECOMMIT_IMAGE: '{{.PRECOMMIT_IMAGE_NAME}}:latest'

tasks:
  main:
    dir: '{{.REPO_ROOT}}'
    cmds:
      - task: '{{if .CI}}run:local{{else}}run:container{{end}}'

  run:local:
    dir: '{{.REPO_ROOT}}'
    cmds:
      - task: lint:run:changed

  run:container:
    dir: '{{.REPO_ROOT}}'
    cmds:
      - task: docker:run
        vars:
          IMAGE: '{{.PRECOMMIT_IMAGE}}'
          VOLUMES: '{{.REPO_ROOT}}:/workspace'
          WORKDIR: /workspace
          COMMAND: task --taskfile .ci/Taskfile.yml pre-commit:run:local
