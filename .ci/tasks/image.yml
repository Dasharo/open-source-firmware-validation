version: '3'

includes:
  precommit-image:
    taskfile: ../../taskfile-templates/templates/build/docker-image.yml
    optional: true
    dir: ../..
    vars:
      IMAGE_NAME: ghcr.io/dasharo/osfv-ci
      DOCKERFILE: .ci/Dockerfile
  qemu-image:
    taskfile: ../../taskfile-templates/templates/build/docker-image.yml
    optional: true
    dir: ../..
    vars:
      IMAGE_NAME: ghcr.io/dasharo/osfv-qemu-ci
      DOCKERFILE: .ci/Dockerfile.qemu

vars:
  BUILD_TAG:
    sh: date -u +%Y%m%d-%H%M%S
  RELEASE_TAG:
    sh: echo "$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"

tasks:
  precommit:build:
    desc: Build the CI image, tagged with a UTC timestamp and latest
    cmds:
      - task: precommit-image:build
        vars: {TAGS: 'latest,{{.BUILD_TAG}}'}

  precommit:release:
    desc: Build and push the CI image
    cmds:
      - task: precommit-image:build-push
        vars: {TAGS: 'latest,{{.RELEASE_TAG}}'}

  precommit:push:
    desc: Push both tags of the CI image
    cmds:
      - task: precommit-image:push
        vars: {TAGS: 'latest,{{.BUILD_TAG}}'}

  qemu:build:
    desc: Build the QEMU CI image, tagged with a UTC timestamp and latest
    cmds:
      - task: qemu-image:build
        vars: {TAGS: 'latest,{{.BUILD_TAG}}'}

  qemu:release:
    desc: Build and push the QEMU CI image
    cmds:
      - task: qemu-image:build-push
        vars: {TAGS: 'latest,{{.RELEASE_TAG}}'}

  qemu:push:
    desc: Push both tags of the QEMU CI image
    cmds:
      - task: qemu-image:push
        vars: {TAGS: 'latest,{{.BUILD_TAG}}'}
