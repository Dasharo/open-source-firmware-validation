# Expected results of trenchboot/ on protectli-vp2430, launched with Intel
# TXT and the platform's SINIT ACM,
# see docs/drtm-report.md. No suite run yet: every test is expected to pass,
# as predicted from the suites and TrenchBoot at the meta-trenchboot revision.
# The first run replaces the basis, and an entry is added for every result
# that is not a pass. WTD012.001 is expected to fail.
---
platform: protectli-vp2430
firmware: dasharo
description: Dasharo coreboot+UEFI for the Protectli VP2430, TXT enabled, with the meta-trenchboot image
kernel: trenchboot
evidence: tpm
basis: predicted from the suites and TrenchBoot Linux 6e037afa, no suite run yet
expectations:
  WTD012.001:
    result: fail
    refs: [trenchboot-locality-2-open]
    basis: >-
      predicted from TrenchBoot Linux 6e037afa: slaunch_pcr_extend() sets the
      kernel's TPM locality to 2 with tpm_chip_set_locality() and nothing
      closes it, so tpm2_pcrextend from the OS goes out at locality 2
