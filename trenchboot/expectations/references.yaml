trenchboot-locality-2-open:
  title: TrenchBoot Linux keeps the TPM at locality 2 for every command after the launch
  requirement: >-
    C07, the launch-time write access closes once the DLME has measured itself;
    PCR 17 and 18 accept an extend at locality 2 (TCG PC Client Platform TPM
    Profile, PCR attributes), so the OS can extend them
  link: https://github.com/TrenchBoot/linux/blob/dbbb5ef0d915435b20290766f99461e31c273b6c/arch/x86/kernel/slmodule.c#L556
