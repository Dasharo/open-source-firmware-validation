- name: Prepare UEFI Shell components
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: /tmp/
    mode: 755
  loop:
    - src: "./../../../osfv-test-data/uefi-shell/Shell.efi"
    - src: "./../../../osfv-test-data/uefi-shell/deploy-shell-efi.sh"

- name: Install UEFI Shell
  ansible.builtin.command: /tmp/deploy-shell-efi.sh /tmp/Shell.efi

- name: Install docker required packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
    state: present
    update_cache: true

- name: Add Docker's official GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: latest
    update_cache: true
