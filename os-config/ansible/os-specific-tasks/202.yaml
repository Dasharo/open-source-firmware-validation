# The WiFi/Bt cards of MTL laptops don't work on Fedora 41 with 6.13 kernel
- name: Get default kernel
  ansible.builtin.command: grubby --default-kernel
  register: default_kernel_version
- name: Get default index
  ansible.builtin.command: grubby --default-index
  register: default_kernel_index
- name: Downgrade default kernel
  ansible.builtin.command: grubby --set-default-index {{ default_kernel_index.stdout | int + 1 }}
  when: '"6.13" in default_kernel_version.stdout'
