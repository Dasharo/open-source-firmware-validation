- name: Common tasks
  hosts: host
  become: true
  tasks:
    - name: Load package names
      ansible.builtin.include_vars: "{{os_id}}-packages.yaml"
    - name: Install packages
      ansible.builtin.package:
        name:
          - "{{package_lm_sensors}}"
          - "{{package_flashrom}}"
          - "{{package_libpci_dev}}"
          - "{{package_alsa_utils}}"
          - "{{package_cpuid}}"
          - "{{package_dmidecode}}"
          - "{{package_acpi_call}}"
          - "{{package_libinput_tools}}"
          - "{{package_iperf3}}"
          - "{{package_fwts}}"
          - "{{package_util_linux}}"
          - "{{package_smartmontools}}"
          - "{{package_ffmeg}}"
          - "{{package_usbutils}}"
          - "{{package_tpm2_tools}}"
        state: present
    - name: Install coreboot tools files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: /usr/bin/
        mode: 755
      loop:
        - src: "./../../osfv-test-data/coreboot-tools/flashrom"
        - src: "./../../osfv-test-data/coreboot-tools/cbmem"
        - src: "./../../osfv-test-data/coreboot-tools/cbfstool"

- name: OS specific tasks
  hosts: host
  become: true
  tasks:
    - name: Include OS specific tasks
      ansible.builtin.include_tasks: "os-specific-tasks/{{ os_id }}.yaml"
