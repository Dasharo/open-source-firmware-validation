# Rebuild and publish the CI images to the internal registry after a merge that
# changes what goes into them. Push only, never on pull_request: the tokens are
# push-scoped secrets, and `latest` is shared by every pipeline.
when:
  - branch: develop
    event: [push, manual]
    path:
      include:
        - requirements.txt
        - .pre-commit-config.yaml
        - .ci/Dockerfile
        - .ci/Dockerfile.qemu
        - .woodpecker/release-image.yml

skip_clone: true

steps:
  - name: clone
    image: git.3mdeb.com/dasharo/osfv-ci:latest
    pull: true
    environment:
      GITEA_TOKEN:
        from_secret: GITEA_BUILDER_TOKEN_REPO_READ
    commands:
      - git init -q .
      - git remote add origin "$(printf '%s' "$${CI_REPO_CLONE_URL}" | sed "s#^https://#https://ci:$${GITEA_TOKEN}@#")"
      - git fetch -q --no-tags origin "+$${CI_COMMIT_SHA}:"
      - git checkout -q FETCH_HEAD

  # osfv-qemu-ci is built FROM osfv-ci:latest, so the base goes first
  - name: release-osfv-ci
    image: git.3mdeb.com/dasharo/osfv-ci:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY_TOKEN:
        from_secret: OSFV_PACKAGER_TOKEN
    commands:
      - echo "$${REGISTRY_TOKEN}" | docker login git.3mdeb.com -u builder --password-stdin
      - task --taskfile .ci/Taskfile.yml ci:image:precommit:release

  - name: release-osfv-qemu-ci
    image: git.3mdeb.com/dasharo/osfv-ci:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY_TOKEN:
        from_secret: OSFV_PACKAGER_TOKEN
    commands:
      - echo "$${REGISTRY_TOKEN}" | docker login git.3mdeb.com -u builder --password-stdin
      - task --taskfile .ci/Taskfile.yml ci:image:qemu:release
