when:
  - event: cron
    cron: osfv-stability-regression
  - event: manual

labels:
  network: office

matrix:
  DEVICE:
    - scripts/ci/regression-scope/configs/devices/msi-pro-b850-p-wifi_00283.json
    - scripts/ci/regression-scope/configs/devices/msi-pro-z690-a-wifi-ddr4_00039.json
    - scripts/ci/regression-scope/configs/devices/novacustom-nuc_box-125H_00245.json
#    - scripts/ci/regression-scope/configs/devices/novacustom-nuc_box-155H_00254.json
#    - scripts/ci/regression-scope/configs/devices/novacustom-v540tnd_00266.json
#    - scripts/ci/regression-scope/configs/devices/novacustom-v540tu_00191.json
    - scripts/ci/regression-scope/configs/devices/pcengines-apu3_00331.json
#    - scripts/ci/regression-scope/configs/devices/protectli-vp2410_00052.json
    - scripts/ci/regression-scope/configs/devices/protectli-vp6650_00002.json

concurrency:
  limit: 1
  group: device-${DEVICE}

skip_clone: true

steps:
  - name: clone
    image: git.3mdeb.com/dasharo/osfv-ci:latest
    pull: true
    environment:
      GITEA_TOKEN:
        from_secret: GITEA_BUILDER_TOKEN_REPO_READ
    commands:
      - git init -q .
      - git remote add origin "$(printf '%s' "$${CI_REPO_CLONE_URL}" | sed "s#^https://#https://ci:$${GITEA_TOKEN}@#")"
      - git fetch -q --no-tags origin "+$${CI_COMMIT_SHA}:"
      - git checkout -q FETCH_HEAD

  - name: stability
    image: git.3mdeb.com/dasharo/osfv-qemu-ci:latest
    pull: true
    environment:
      STABILITY_LOGS_DIR: /srv/nfs/logs/osfv_stability/ci_logs
      NFS_IP:
        from_secret: OSFV_NFS_IP
      SNIPEIT_CONFIG:
        from_secret: SNIPEIT_YAML_CONFIG_FILE
      OSFV_ROMS_DIR: /srv/nfs/roms
    privileged: true
    commands:
      # Installing snipeit creds
      - mkdir -p "/root/.osfv"
      - printf '%s\n' "$${SNIPEIT_CONFIG}" > "/root/.osfv/snipeit.yml"
      # The mount lives in this container's mount namespace only, so it has to
      # be done in the same step as the run. It disappears with the container.
      - mkdir -p /srv/nfs/logs
      - mount -t nfs -o nolock "$${NFS_IP}":/srv/nfs/logs /srv/nfs/logs
      - mountpoint -q /srv/nfs/logs
      - ls /srv/nfs/logs
      - mkdir -p /srv/nfs/roms
      - mount -t nfs -o nolock,ro "$${NFS_IP}":/srv/nfs/roms /srv/nfs/roms
      - mountpoint -q /srv/nfs/roms
      - RUN_ID="${CI_COMMIT_BRANCH}_${CI_COMMIT_SHA}/$(date -u -d @${CI_PIPELINE_CREATED} '+%Y_%m_%d_%H_%M_%S')"
      - |
        TASK_X_REMOTE_TASKFILES=1 task --yes --taskfile .ci/Taskfile.yml \
        ci:stability-device DEVICE="$${DEVICE}" LOGS_DIR="$${STABILITY_LOGS_DIR}" RUN_ID="$${RUN_ID}"

  - name: check-in # make sure its checked in even if the task fails
    image: git.3mdeb.com/dasharo/osfv-qemu-ci:latest
    environment:
      SNIPEIT_CONFIG:
        from_secret: SNIPEIT_YAML_CONFIG_FILE
    commands:
      - mkdir -p "/root/.osfv"
      - printf '%s\n' "$${SNIPEIT_CONFIG}" > "/root/.osfv/snipeit.yml"
      - osfv_cli snipeit check_in --asset_id "$${DEVICE##*_}" || true
    when:
      - status: [success, failure]
