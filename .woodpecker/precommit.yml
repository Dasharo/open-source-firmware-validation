when:
  - branch: [develop, main]
    event: [pull_request, push, manual]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: false
      partial: false
      depth: 0

steps:
  - name: pre-commit
    image: ghcr.io/dasharo/osfv-ci:latest
    commands:
      - git submodule update --init taskfile-templates
      - task --taskfile .ci/Taskfile.yml ci:pre-commit
