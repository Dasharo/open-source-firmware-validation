when:
  # Nightly run, the cron entry itself is defined in the repository settings
  - event: cron
    cron: qemu-stress-test
    branch: develop

labels:
  kvm: true

skip_clone: true

steps:
  - name: clone
    image: git.3mdeb.com/dasharo/osfv-ci:latest
    pull: true
    environment:
      GITEA_TOKEN:
        from_secret: GITEA_BUILDER_TOKEN_REPO_READ
    commands:
      - git init -q .
      - git remote add origin "$(printf '%s' "$${CI_REPO_CLONE_URL}" | sed "s#^https://#https://ci:$${GITEA_TOKEN}@#")"
      - git fetch -q --no-tags origin "+$${CI_COMMIT_SHA}:"
      - git checkout -q FETCH_HEAD

  - name: qemu-stress-test
    image: git.3mdeb.com/dasharo/osfv-qemu-ci:latest
    pull: true
    # QEMU is run with KVM acceleration, which needs /dev/kvm. Requires the
    # repository to be marked as trusted in the Woodpecker settings.
    privileged: true
    commands:
      - TASK_X_REMOTE_TASKFILES=1 task --yes --taskfile .ci/Taskfile.yml ci:qemu-stress-test
