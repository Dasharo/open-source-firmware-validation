# Only try to run if a robot file or a lib was modified in the PR
when:
  - branch: develop
    event: [pull_request, manual]
    path:
      include:
        - '*.robot'
        - '**/*.robot'
        - lib/**
        - .ci/develop-pr-regression.sh
        - .ci/Dockerfile.qemu
        - .woodpecker/develop-pr-regression.yml

labels:
  network: office

# One workflow per device, so that every device reports its own status and a
# device failing does not hide the results of the others
matrix:
  DEVICE:
    - scripts/ci/regression-scope/configs/devices/msi-pro-z690-a-wifi-ddr4_00039.json
    - scripts/ci/regression-scope/configs/devices/pcengines-apu3_00331.json

concurrency:
  limit: 1
  group: device-${DEVICE} # only one job will work on one device from the matrix

skip_clone: true

steps:
  - name: clone
    image: git.3mdeb.com/dasharo/osfv-ci:latest
    pull: true
    environment:
      GITEA_TOKEN:
        from_secret: GITEA_BUILDER_TOKEN_REPO_READ
    commands:
      - git init -q .
      - git remote add origin "$(printf '%s' "$${CI_REPO_CLONE_URL}" | sed "s#^https://#https://ci:$${GITEA_TOKEN}@#")"
      - git fetch -q --no-tags origin "+$${CI_COMMIT_SHA}:"
      - git checkout -q FETCH_HEAD

  - name: regression
    image: git.3mdeb.com/dasharo/osfv-qemu-ci:latest
    pull: true
    environment:
      SNIPEIT_CONFIG:
        from_secret: SNIPEIT_YAML_CONFIG_FILE
      BASE_BRANCH: ${CI_COMMIT_TARGET_BRANCH}
      NFS_IP:
        from_secret: OSFV_NFS_IP
      OSFV_ROMS_DIR: /srv/nfs/roms
    privileged: true
    commands:
      - mkdir -p /srv/nfs/roms
      - mount -t nfs -o nolock,ro "$${NFS_IP}":/srv/nfs/roms /srv/nfs/roms
      - mountpoint -q /srv/nfs/roms
      - TASK_X_REMOTE_TASKFILES=1 task --yes --taskfile .ci/Taskfile.yml ci:develop-pr-regression DEVICE="$${DEVICE}"

  - name: check-in # make sure its checked in even if the task fails
    image: git.3mdeb.com/dasharo/osfv-qemu-ci:latest
    environment:
      SNIPEIT_CONFIG:
        from_secret: SNIPEIT_YAML_CONFIG_FILE
    commands:
      - mkdir -p "/root/.osfv"
      - printf '%s\n' "$${SNIPEIT_CONFIG}" > "/root/.osfv/snipeit.yml"
      - osfv_cli snipeit check_in --asset_id "$${DEVICE##*_}" || true
    when:
      - status: [success, failure]
