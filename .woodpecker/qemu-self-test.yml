when:
  - branch: [develop, main]
    event: [pull_request, manual]
    path:
      include:
        - lib/**
        - keywords.robot
        - requirements.txt
        - scripts/ci/qemu-run.sh
        - scripts/ci/qemu-self-test.sh
        - .ci/Dockerfile.qemu
        - .ci/qemu-self-test.sh
        - .woodpecker/qemu-self-test.yml
  # Nightly run, the cron entry itself is defined in the repository settings
  - event: cron
    cron: qemu-self-test

labels:
  kvm: true

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: false

steps:
  - name: qemu-self-test
    image: ghcr.io/dasharo/osfv-qemu-ci:latest
    pull: true
    # QEMU is run with KVM acceleration, which needs /dev/kvm. Requires the
    # repository to be marked as trusted in the Woodpecker settings.
    privileged: true
    commands:
      - TASK_X_REMOTE_TASKFILES=1 task --yes --taskfile .ci/Taskfile.yml ci:qemu-self-test
