name: Scoped regression on PRs

# Only try to run if a robot file or a lib was modified in the PR
on:
  pull_request:
    branches:
      - develop
    paths:
      - '**.robot'
      - 'lib/**'

env:
  ALLOW_DIRTY: 1

concurrency:
  group: shared-resource-lock
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        clean: true

    - name: Chceckout submodules
      run: |
        git submodule update --init --checkout --recursive

    - name: Fetch develop branch
      run: git fetch origin develop

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        rm -rf venv
        python -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        deactivate
        source venv/bin/activate

    - name: Execute robot command
      run: |
        scripts/ci/develop_pr_auto_regression.sh

    - name: Upload HTML files as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: HTML-Reports
        path: |
          logs/
